name: Build ESP32 Home Automation

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        idf-version: ["v5.1.2"]
        target: ["esp32"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with ESP-IDF ${{ matrix.idf-version }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf-version }}   # ✅ 'idf_version' की जगह 'esp_idf_version'
          target: ${{ matrix.target }}
          path: '.'

      # यह स्टेप जोड़ें ताकि बाइनरी फ़ाइलें डाउनलोड के लिए सेव हो जाएँ
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: home_automation_bin_${{ matrix.target }}_${{ matrix.idf-version }}
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
